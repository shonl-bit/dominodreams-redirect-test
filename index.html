<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domino Dreams</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#0f1115; color:#e7e9ee;
                 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { height:100%; display:flex; align-items:center; justify-content:center;
            text-align:center; padding:24px; }
    h1 { font-size:22px; margin:0 0 6px; font-weight:600; }
    p  { margin:0; opacity:.7; font-size:14px; }
    #fallback-btn {
      display:none; margin-top:24px;
      padding:14px 28px; border-radius:12px;
      background:#f5a623; color:#000; font-size:16px; font-weight:700;
      border:none; cursor:pointer; text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Opening Domino Dreams…</h1>
      <p>Redirecting to the store.</p>
      <a id="fallback-btn">Tap here to open the store</a>
    </div>
  </div>

  <script src="https://onelinksmartscript.appsflyer.com/onelink-smart-script-latest.js"></script>
  <script>
    (function () {
      var ONELINK_URL = "https://get.domino-dreams.com/dbMT";

      var qs = new URLSearchParams(window.location.search);
      var fbclid = qs.get("fbclid") || "";

      function buildFallback() {
        var base = ONELINK_URL
          + "?af_xp=custom"
          + "&pid=facebook"
          + "&c=" + encodeURIComponent(qs.get("utm_campaign") || "meta_test_campaign")
          + "&af_dp=" + encodeURIComponent("dominodreams://mainactivity");
        if (fbclid) base += "&af_sub2=" + encodeURIComponent(fbclid);
        return base;
      }

      try {
        var result = window.AF_SMART_SCRIPT.generateOneLinkURL({
          oneLinkURL: ONELINK_URL,
          afParameters: {
            mediaSource: { keys: ["utm_source"],   defaultValue: "TEST_FB" },
            campaign:    { keys: ["utm_campaign"], defaultValue: "meta_test_campaign" },
            adSet:       { keys: ["utm_content"] },
            ad:          { keys: ["utm_term"] },
            afSub2:      { keys: ["fbclid"] },
            afCustom: [
              { paramKey: "af_xp", defaultValue: "custom" },
              { paramKey: "af_dp", defaultValue: "dominodreams://mainactivity" }
            ]
          }
        });
        var url = (result && result.clickURL) ? result.clickURL : buildFallback();
        window.location.href = url;
        showFallback(url);
      } catch (e) {
        var url = buildFallback();
        window.location.href = url;
        showFallback(url);
      }

      function showFallback(url) {
        setTimeout(function () {
          var btn = document.getElementById("fallback-btn");
          btn.href = url;
          btn.style.display = "inline-block";
        }, 2000);
      }
    })();
  </script>
</body>
</html>
