<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domino Dreams</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f7e6bf;
      color: #21160f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .content {
      width: min(480px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(255, 255, 255, .55);
    }

    p {
      margin: 0;
      opacity: .78;
      font-size: 14px;
    }

    #fallback-btn {
      display: none;
      margin-top: 24px;
      padding: 14px 28px;
      border-radius: 12px;
      background: #f5a623;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="content">
      <h1>Opening Domino Dreams...</h1>
      <p>Redirecting to the store.</p>
      <a id="fallback-btn">Tap here to open the store</a>
    </div>
  </div>

  <script src="https://onelinksmartscript.appsflyersdk.com/onelink-smart-script-latest.js"></script>
  <script>
    (function () {
      var ONELINK_URL = "https://dominodreams.onelink.me/dbMT";
      var META_WEB_MEDIA_SOURCE = "metaweb_int";
      var WEB_TO_APP_VALUE = "web2app";
      var NO_CAMPAIGN_NAME = "no_campaign_name";

      var qs = new URLSearchParams(window.location.search);

      function isBadMacro(value) {
        return !value || /^\s*\{\{.*\}\}\s*$/.test(value);
      }

      function firstValue(keys, defaultValue) {
        for (var i = 0; i < keys.length; i++) {
          var value = qs.get(keys[i]);
          if (!isBadMacro(value)) return value;
        }

        return defaultValue || "";
      }

      function appendParam(url, key, value) {
        if (!value) return url;
        return url + "&" + key + "=" + encodeURIComponent(value);
      }

      function getSafeValues() {
        return {
          pid: firstValue(["pid"], META_WEB_MEDIA_SOURCE),
          campaign: firstValue(["c", "af_campaign"], NO_CAMPAIGN_NAME),
          campaignId: firstValue(["af_c_id", "af_campaign_id"]),
          siteId: firstValue(["af_siteid", "site_source_name"]),
          adset: firstValue(["af_adset"]),
          adsetId: firstValue(["af_adset_id"]),
          ad: firstValue(["af_ad"]),
          adId: firstValue(["af_ad_id"]),
          fbclid: firstValue(["fbclid"]),
          webToApp: firstValue(["web2app"], WEB_TO_APP_VALUE)
        };
      }

      function buildFallbackClickUrl(values) {
        var base = ONELINK_URL
          + "?af_js_web=true"
          + "&pid=" + encodeURIComponent(values.pid)
          + "&c=" + encodeURIComponent(values.campaign);

        base = appendParam(base, "af_c_id", values.campaignId);
        base = appendParam(base, "af_siteid", values.siteId);
        base = appendParam(base, "af_adset", values.adset);
        base = appendParam(base, "af_adset_id", values.adsetId);
        base = appendParam(base, "af_ad", values.ad);
        base = appendParam(base, "af_ad_id", values.adId);
        base = appendParam(base, "fbclid", values.fbclid);
        base = appendParam(base, "af_sub5", values.fbclid);
        base = appendParam(base, "af_sub4", values.webToApp);
        base = appendParam(base, "af_ss_ui", "true");

        return base;
      }

      function defaultParam(value) {
        return { keys: [], defaultValue: value };
      }

      function customParam(paramKey, value) {
        if (!value) return null;
        return { paramKey: paramKey, keys: [], defaultValue: value };
      }

      function compact(items) {
        var result = [];
        for (var i = 0; i < items.length; i++) {
          if (items[i]) result.push(items[i]);
        }
        return result;
      }

      function buildSmartScriptClickUrl(values) {
        if (!window.AF_SMART_SCRIPT || !window.AF_SMART_SCRIPT.generateOneLinkURL) {
          return "";
        }

        var afParameters = {
          mediaSource: defaultParam(values.pid),
          campaign: defaultParam(values.campaign),
          afSub4: defaultParam(values.webToApp),
          afCustom: compact([
            customParam("af_c_id", values.campaignId),
            customParam("af_siteid", values.siteId),
            customParam("af_adset_id", values.adsetId),
            customParam("af_ad_id", values.adId),
            customParam("af_ss_ui", "true")
          ])
        };

        if (values.adset) afParameters.adSet = defaultParam(values.adset);
        if (values.ad) afParameters.ad = defaultParam(values.ad);
        if (values.fbclid) afParameters.afSub5 = defaultParam(values.fbclid);

        var result = window.AF_SMART_SCRIPT.generateOneLinkURL({
          oneLinkURL: ONELINK_URL,
          afParameters: afParameters
        });

        return result && result.clickURL ? result.clickURL : "";
      }

      function redirectTo(url) {
        window.location.href = url;
        showFallback(url);
      }

      function showFallback(url) {
        setTimeout(function () {
          var btn = document.getElementById("fallback-btn");
          btn.href = url;
          btn.style.display = "inline-block";
        }, 2000);
      }

      var values = getSafeValues();
      var smartScriptUrl = "";

      try {
        smartScriptUrl = buildSmartScriptClickUrl(values);
      } catch (e) {
        smartScriptUrl = "";
      }

      redirectTo(smartScriptUrl || buildFallbackClickUrl(values));
    })();
  </script>
</body>
</html>
