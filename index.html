<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domino Dreams</title>
  <style>
    html, body { margin:0; padding:0; height:100%; background:#0f1115; color:#e7e9ee;
                 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { height:100%; display:flex; align-items:center; justify-content:center;
            text-align:center; padding:24px; }
    h1 { font-size:22px; margin:0 0 6px; font-weight:600; }
    p  { margin:0; opacity:.7; font-size:14px; }
    #fallback-btn {
      display:none; margin-top:24px;
      padding:14px 28px; border-radius:12px;
      background:#f5a623; color:#000; font-size:16px; font-weight:700;
      border:none; cursor:pointer; text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Opening Domino Dreams…</h1>
      <p>Redirecting to the store.</p>
      <a id="fallback-btn">Tap here to open the store</a>
    </div>
  </div>

  <script src="https://onelinksmartscript.appsflyer.com/onelink-smart-script-latest.js"></script>
  <script>
    (function () {
      var ONELINK_URL = "https://get.domino-dreams.com/dbMT";
      var META_WEB_MEDIA_SOURCE = "metaweb_int";
      var META_WEB_MARKER = "meta_web_to_app";

      var qs = new URLSearchParams(window.location.search);
      var fbclid = qs.get("fbclid") || "";

      function firstValue(keys, defaultValue) {
        for (var i = 0; i < keys.length; i++) {
          var value = qs.get(keys[i]);
          if (value) return value;
        }

        return defaultValue || "";
      }

      function getMediaSource() {
        var mediaSource = firstValue(["pid", "af_media_source", "utm_source"], META_WEB_MEDIA_SOURCE);
        return mediaSource === "facebook" ? META_WEB_MEDIA_SOURCE : mediaSource;
      }

      function appendParam(url, key, value) {
        if (!value) return url;
        return url + "&" + key + "=" + encodeURIComponent(value);
      }

      function buildFallback() {
        var base = ONELINK_URL
          + "?af_xp=custom"
          + "&pid=" + encodeURIComponent(getMediaSource())
          + "&c=" + encodeURIComponent(firstValue(["c", "af_campaign", "utm_campaign"], "meta_web_unknown_campaign"))
          + "&af_dp=" + encodeURIComponent("dominodreams://mainactivity");

        base = appendParam(base, "af_adset", firstValue(["af_adset", "utm_content", "utm_adset"]));
        base = appendParam(base, "af_ad", firstValue(["af_ad", "utm_term", "utm_ad"]));
        base = appendParam(base, "af_c_id", firstValue(["af_c_id", "af_campaign_id", "campaign_id", "utm_id"]));
        base = appendParam(base, "af_campaign_id", firstValue(["af_campaign_id", "af_c_id", "campaign_id", "utm_id"]));
        base = appendParam(base, "af_adset_id", firstValue(["af_adset_id", "adset_id"]));
        base = appendParam(base, "af_ad_id", firstValue(["af_ad_id", "ad_id"]));
        base = appendParam(base, "fbclid", fbclid);
        base = appendParam(base, "af_sub2", fbclid);
        base = appendParam(base, "af_sub5", META_WEB_MARKER);

        return base;
      }

      try {
        var result = window.AF_SMART_SCRIPT.generateOneLinkURL({
          oneLinkURL: ONELINK_URL,
          afParameters: {
            mediaSource: {
              keys: ["pid", "af_media_source", "utm_source"],
              overrideValues: { facebook: META_WEB_MEDIA_SOURCE },
              defaultValue: META_WEB_MEDIA_SOURCE
            },
            campaign:    { keys: ["c", "af_campaign", "utm_campaign"], defaultValue: "meta_web_unknown_campaign" },
            adSet:       { keys: ["af_adset", "utm_content", "utm_adset"] },
            ad:          { keys: ["af_ad", "utm_term", "utm_ad"] },
            afSub2:      { keys: ["fbclid"] },
            afSub5:      { keys: [], defaultValue: META_WEB_MARKER },
            afCustom: [
              { paramKey: "af_xp", defaultValue: "custom" },
              { paramKey: "af_dp", defaultValue: "dominodreams://mainactivity" },
              { paramKey: "af_c_id", keys: ["af_c_id", "af_campaign_id", "campaign_id", "utm_id"] },
              { paramKey: "af_campaign_id", keys: ["af_campaign_id", "af_c_id", "campaign_id", "utm_id"] },
              { paramKey: "af_adset_id", keys: ["af_adset_id", "adset_id"] },
              { paramKey: "af_ad_id", keys: ["af_ad_id", "ad_id"] }
            ]
          }
        });
        var url = (result && result.clickURL) ? result.clickURL : buildFallback();
        // window.location.href = url;
        showFallback(url);
      } catch (e) {
        var url = buildFallback();
        // window.location.href = url;
        showFallback(url);
      }

      function showFallback(url) {
        setTimeout(function () {
          var btn = document.getElementById("fallback-btn");
          btn.href = url;
          btn.style.display = "inline-block";
        }, 2000);
      }
    })();
  </script>
</body>
</html>
