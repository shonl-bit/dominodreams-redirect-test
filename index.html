<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domino Dreams</title>
  <!-- Meta Pixel Code -->

    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',

  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1011726111294870&ev=PageView&noscript=1"
  /></noscript>

  <style>
    html, body { margin:0; padding:0; height:100%; background:#0f1115; color:#e7e9ee;
                 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
    .wrap { height:100%; display:flex; align-items:center; justify-content:center;
            text-align:center; padding:24px; }
    h1 { font-size:22px; margin:0 0 6px; font-weight:600; }
    p  { margin:0; opacity:.7; font-size:14px; }
    #fallback-btn {
      display:none; margin-top:24px;
      padding:14px 28px; border-radius:12px;
      background:#f5a623; color:#000; font-size:16px; font-weight:700;
      border:none; cursor:pointer; text-decoration:none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>Opening Domino Dreams…</h1>
      <p>Redirecting to the store.</p>
      <a id="fallback-btn">Tap here to open the store</a>
    </div>
  </div>

  <script src="https://onelinksmartscript.appsflyersdk.com/onelink-smart-script-latest.js"></script>
  <script>
    (function () {
      var ONELINK_URL = "https://dominodreams.onelink.me/dbMT";
      var META_WEB_MEDIA_SOURCE = "metaweb_int";
      var WEB_TO_APP_VALUE = "web2app";

      var qs = new URLSearchParams(window.location.search);

      function firstValue(keys, defaultValue) {
        for (var i = 0; i < keys.length; i++) {
          var value = qs.get(keys[i]);
          if (value) return value;
        }

        return defaultValue || "";
      }

      function appendParam(url, key, value) {
        if (!value) return url;
        return url + "&" + key + "=" + encodeURIComponent(value);
      }

      function buildFallback() {
        var base = ONELINK_URL
          + "?af_js_web=true"
          + "&pid=" + encodeURIComponent(firstValue(["pid"], META_WEB_MEDIA_SOURCE))
          + "&c=" + encodeURIComponent(firstValue(["c"], "{{campaign.name}}"));

        base = appendParam(base, "campaign_id", firstValue(["campaign_id"], "{{campaign.id}}"));
        base = appendParam(base, "af_adset", firstValue(["af_adset"], "{{adset.name}}"));
        base = appendParam(base, "adset_id", firstValue(["adset_id"], "{{adset.id}}"));
        base = appendParam(base, "ad_name", firstValue(["ad_name"], "{{ad.name}}"));
        base = appendParam(base, "ad_id", firstValue(["ad_id"], "{{ad.id}}"));
        base = appendParam(base, "fbclid", firstValue(["fbclid"]));
        base = appendParam(base, "af_sub5", firstValue(["fbclid"]));
        base = appendParam(base, "af_sub4", firstValue(["web2app"], WEB_TO_APP_VALUE));
        base = appendParam(base, "af_ss_ui", "true");

        return base;
      }

      function redirectTo(url) {
        window.location.href = url;
        showFallback(url);
      }

      try {
        if (!window.AF_SMART_SCRIPT || !window.AF_SMART_SCRIPT.generateOneLinkURL) {
          redirectTo(buildFallback());
          return;
        }

        var result = window.AF_SMART_SCRIPT.generateOneLinkURL({
          oneLinkURL: ONELINK_URL,
          afParameters: {
            mediaSource: { keys: ["pid"], defaultValue: META_WEB_MEDIA_SOURCE },
            campaign:    { keys: ["c"], defaultValue: "%7B%7Bcampaign.name%7D%7D" },
            adSet:       { keys: ["af_adset"], defaultValue: "%7B%7Badset.name%7D%7D" },
            afSub5:      { keys: ["fbclid"] },
            afSub4:      { keys: ["web2app"], defaultValue: WEB_TO_APP_VALUE },
            afCustom: [
              { paramKey: "campaign_id", keys: ["campaign_id"], defaultValue: "%7B%7Bcampaign.id%7D%7D" },
              { paramKey: "adset_id", keys: ["adset_id"], defaultValue: "%7B%7Badset.id%7D%7D" },
              { paramKey: "ad_name", keys: ["ad_name"], defaultValue: "%7B%7Bad.name%7D%7D" },
              { paramKey: "ad_id", keys: ["ad_id"], defaultValue: "%7B%7Bad.id%7D%7D" },
              { paramKey: "af_ss_ui", defaultValue: "true" }
            ]
          }
        });
        var url = (result && result.clickURL) ? result.clickURL : buildFallback();
        redirectTo(url);
      } catch (e) {
        redirectTo(buildFallback());
      }

      function showFallback(url) {
        setTimeout(function () {
          var btn = document.getElementById("fallback-btn");
          btn.href = url;
          btn.style.display = "inline-block";
        }, 2000);
      }
    })();
  </script>
</body>
</html>
